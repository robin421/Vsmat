<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle / Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Shield and Keyhole Emblem -->
  <g filter="url(#shadow)" transform="translate(106, 86)">
    <!-- Shield Shape: 300x340 -->
    <path d="M150 0 C220 0 300 24 300 110 C300 230 190 310 150 340 C110 310 0 230 0 110 C0 24 80 0 150 0 Z"
          fill="url(#shieldGrad)" />
    <!-- Lock Keyhole Circle & Slot -->
    <circle cx="150" cy="140" r="38" fill="#1e40af" />
    <path d="M136 140 L164 140 L170 216 L130 216 Z" fill="#1e40af" />
  </g>
</svg>
